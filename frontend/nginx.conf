# Нужно для WebSocket (совместное редактирование в будущем)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Книги и сканы бывают большими
    client_max_body_size 200m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        # У файлов в /assets хеш в имени, их можно кешировать навсегда
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        # SPA: любой путь вроде /notes/<id> отдаёт index.html, маршрут разбирает React
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
