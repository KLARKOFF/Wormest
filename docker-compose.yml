# Запуск всего приложения: docker compose up -d --build
# Потом открыть http://<адрес-компьютера>:8000 с ноутбука или телефона в той же сети.

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wormest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в файле .env}
      POSTGRES_DB: ${POSTGRES_DB:-wormest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wormest}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wormest}?sslmode=disable
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
    volumes:
      - files:/data/files
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8000}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # На 6-й неделе здесь появится ollama для эмбеддингов

volumes:
  pgdata:
  files:
